name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Prepare Release Metadata
    runs-on: ubuntu-latest
    outputs:
      cargo_version: ${{ steps.version.outputs.cargo_version }}
      release_name: ${{ steps.version.outputs.release_name }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        name: Compute Release Tag
        shell: bash
        run: |
          set -euo pipefail

          cargo_version="$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -n 1)"

          if [[ -z "${cargo_version}" ]]; then
            echo "Could not read version from Cargo.toml" >&2
            exit 1
          fi

          release_tag="v${cargo_version}-build.${GITHUB_RUN_NUMBER}"
          release_name="pdf_cutter ${release_tag}"

          echo "cargo_version=${cargo_version}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "release_name=${release_name}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Build Artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release

      - name: Build Release Bundle
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          bash ./build.sh "${{ matrix.platform }}" --with-artifacts

      - name: Upload Release Bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-bundle
          path: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Download Bundles
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create or Update Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_NAME: ${{ needs.prepare.outputs.release_name }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          files=(artifacts/*)

          if (( ${#files[@]} == 0 )); then
            echo "No release artifacts were downloaded." >&2
            exit 1
          fi

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${files[@]}" --clobber
            gh release edit "${RELEASE_TAG}" --title "${RELEASE_NAME}"
          else
            gh release create "${RELEASE_TAG}" "${files[@]}" \
              --title "${RELEASE_NAME}" \
              --generate-notes \
              --target "${TARGET_SHA}"
          fi
