name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and attach artifacts to.
        required: true
        type: string
      platforms:
        description: Platforms to build.
        required: true
        type: choice
        default: windows
        options:
          - windows
          - macos
          - linux
          - macos,windows
          - linux,macos,windows

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Prepare Release Metadata
    runs-on: ubuntu-latest
    outputs:
      release_name: ${{ steps.version.outputs.release_name }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      release_ref: ${{ steps.version.outputs.release_ref }}
      skip: ${{ steps.version.outputs.skip }}
      matrix: ${{ steps.version.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5

      - id: version
        name: Compute Release Tag And Build Matrix
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_PLATFORMS: ${{ github.event.inputs.platforms }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail

          # A push to main publishes the workspace version for Linux and macOS,
          # once: a version that already has a release is left alone, so only a
          # version bump reaching main publishes anything. Windows is built on
          # demand, against a tag that already exists, and attached to the
          # release that push created.
          skip=false
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            release_tag="${INPUT_TAG}"
            selected="${INPUT_PLATFORMS}"
            release_ref="refs/tags/${release_tag}"
          else
            release_tag="$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml)"
            selected="linux,macos"

            if gh release view "${release_tag}" >/dev/null 2>&1; then
              echo "Release ${release_tag} already exists; nothing to publish." >&2
              skip=true
            fi

            # An existing tag is what the version was cut from; without one,
            # the release tags this commit.
            if [[ -n "$(git ls-remote --tags origin "refs/tags/${release_tag}")" ]]; then
              release_ref="refs/tags/${release_tag}"
            else
              release_ref="${GITHUB_SHA}"
            fi
          fi

          if [[ -z "${release_tag}" ]]; then
            echo "Could not read release tag from GitHub context" >&2
            exit 1
          fi

          entries=()

          IFS=',' read -ra platforms <<< "${selected}"
          for platform in "${platforms[@]}"; do
            case "${platform}" in
              linux)
                entries+=('{"os":"ubuntu-latest","platform":"linux"}')
                ;;
              macos)
                entries+=('{"os":"macos-latest","platform":"macos"}')
                ;;
              windows)
                entries+=('{"os":"windows-latest","platform":"windows"}')
                ;;
              *)
                echo "Unsupported platform: ${platform}" >&2
                exit 1
                ;;
            esac
          done

          if (( ${#entries[@]} == 0 )); then
            echo "No platforms selected" >&2
            exit 1
          fi

          matrix="{\"include\":[$(IFS=','; echo "${entries[*]}")]}"
          release_name="pdf-toolkit ${release_tag}"

          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "release_ref=${release_ref}" >> "${GITHUB_OUTPUT}"
          echo "skip=${skip}" >> "${GITHUB_OUTPUT}"
          echo "release_name=${release_name}" >> "${GITHUB_OUTPUT}"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.release_ref }}

      # Installs the toolchain pinned in rust-toolchain.toml, not whatever
      # stable is on the day the release is built.
      - name: Install Rust Toolchain
        shell: bash
        run: rustup toolchain install

      - name: Cache Cargo Build Artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release

      # Tests are off for the release build for now: the corpus-backed e2e suites take
      # minutes per platform and are gated locally by build.sh before a tag is cut. The
      # checks, clippy and the locked release build still run.
      - name: Build Release Bundle
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          SKIP_TESTS: "1"
        run: |
          bash ./build.sh "${{ matrix.platform }}" --with-artifacts

      - name: Upload Release Bundle
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.platform }}-bundle
          path: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.release_ref }}

      - name: Download Bundles
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Load Custom Release Notes
        id: notes
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail

          notes_path=".github/release-notes/${RELEASE_TAG}.md"

          if [[ -f "${notes_path}" ]]; then
            {
              echo "custom_notes<<EOF"
              cat "${notes_path}"
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
          fi

      - name: Create or Update Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CUSTOM_NOTES: ${{ steps.notes.outputs.custom_notes }}
          RELEASE_NAME: ${{ needs.prepare.outputs.release_name }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          files=(artifacts/*)

          if (( ${#files[@]} == 0 )); then
            echo "No release artifacts were downloaded." >&2
            exit 1
          fi

          # The checkout is pinned to the tag, so this is the tagged commit even
          # when the run was dispatched from a branch.
          target_sha="$(git rev-parse HEAD)"

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${files[@]}" --clobber

            if [[ -n "${CUSTOM_NOTES:-}" ]]; then
              current_body="$(gh release view "${RELEASE_TAG}" --json body --jq .body)"

              if [[ "${current_body}" == "${CUSTOM_NOTES}"* ]]; then
                release_body="${current_body}"
              elif [[ -n "${current_body}" ]]; then
                release_body="${CUSTOM_NOTES}"$'\n\n'"${current_body}"
              else
                release_body="${CUSTOM_NOTES}"
              fi

              gh release edit "${RELEASE_TAG}" \
                --title "${RELEASE_NAME}" \
                --notes "${release_body}"
            else
              gh release edit "${RELEASE_TAG}" --title "${RELEASE_NAME}"
            fi
          else
            release_args=(
              "${RELEASE_TAG}"
              "${files[@]}"
              --title "${RELEASE_NAME}"
              --generate-notes
            )

            # An existing tag already names the commit. Passing it as the
            # target anyway is refused (403) whenever the commits between it
            # and the branch head touch workflow files, which GITHUB_TOKEN
            # may not do; only a new tag needs a target, and that is the head.
            if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null; then
              release_args+=(--verify-tag)
            else
              release_args+=(--target "${target_sha}")
            fi

            if [[ -n "${CUSTOM_NOTES:-}" ]]; then
              release_args+=(--notes "${CUSTOM_NOTES}")
            fi

            gh release create "${release_args[@]}"
          fi
