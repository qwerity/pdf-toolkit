name: Release

on:
  push:
    tags:
      - '**'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Prepare Release Metadata
    runs-on: ubuntu-latest
    outputs:
      release_name: ${{ steps.version.outputs.release_name }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - id: version
        name: Compute Release Tag
        shell: bash
        run: |
          set -euo pipefail

          release_tag="${GITHUB_REF_NAME}"

          if [[ -z "${release_tag}" ]]; then
            echo "Could not read release tag from GitHub context" >&2
            exit 1
          fi

          release_name="pdf_cutter ${release_tag}"

          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "release_name=${release_name}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Build Artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release

      - name: Build Release Bundle
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          bash ./build.sh "${{ matrix.platform }}" --with-artifacts

      - name: Upload Release Bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-bundle
          path: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Bundles
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Load Custom Release Notes
        id: notes
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail

          notes_path=".github/release-notes/${RELEASE_TAG}.md"

          if [[ -f "${notes_path}" ]]; then
            {
              echo "custom_notes<<EOF"
              cat "${notes_path}"
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
          fi

      - name: Create or Update Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CUSTOM_NOTES: ${{ steps.notes.outputs.custom_notes }}
          RELEASE_NAME: ${{ needs.prepare.outputs.release_name }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          files=(artifacts/*)

          if (( ${#files[@]} == 0 )); then
            echo "No release artifacts were downloaded." >&2
            exit 1
          fi

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${files[@]}" --clobber

            if [[ -n "${CUSTOM_NOTES:-}" ]]; then
              current_body="$(gh release view "${RELEASE_TAG}" --json body --jq .body)"

              if [[ "${current_body}" == "${CUSTOM_NOTES}"* ]]; then
                release_body="${current_body}"
              elif [[ -n "${current_body}" ]]; then
                release_body="${CUSTOM_NOTES}"$'\n\n'"${current_body}"
              else
                release_body="${CUSTOM_NOTES}"
              fi

              gh release edit "${RELEASE_TAG}" \
                --title "${RELEASE_NAME}" \
                --notes "${release_body}"
            else
              gh release edit "${RELEASE_TAG}" --title "${RELEASE_NAME}"
            fi
          else
            release_args=(
              "${RELEASE_TAG}"
              "${files[@]}"
              --title "${RELEASE_NAME}"
              --generate-notes
              --target "${TARGET_SHA}"
            )

            if [[ -n "${CUSTOM_NOTES:-}" ]]; then
              release_args+=(--notes "${CUSTOM_NOTES}")
            fi

            gh release create "${release_args[@]}"
          fi
