[workspace]
members = ["crates/*"]
resolver = "3"

# Shared across every crate so the whole workspace moves version and toolchain
# together. The dependency versions live here for the same reason: two crates
# resolving different pdfium-render releases would load two sets of bindings
# against one native library.
[workspace.package]
version = "0.18.0"
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
anyhow = "1.0"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.23"
clap = { version = "4.6", features = ["derive"] }
dotenvy = "0.15"
earcutr = "0.5"
fast_image_resize = "6.1"
flate2 = "1.1"
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "service"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
futures-core = { version = "0.3", default-features = false }
geo = "0.33"
geojson = "1.0.0"
image = { version = "0.25", default-features = false, features = ["png"] }
indexmap = { version = "2", features = ["serde"] }
jpeg-encoder = "0.7"
llm-providers = { path = "crates/llm-providers" }
lopdf = { version = "0.45.0", default-features = false, features = ["chrono"] }
pdf-armscii = { path = "crates/pdf-armscii" }
pdf-classify = { path = "crates/pdf-classify" }
pdf-core = { path = "crates/pdf-core" }
pdf-dossier = { path = "crates/pdf-dossier" }
pdf-downsample = { path = "crates/pdf-downsample" }
pdf-geo = { path = "crates/pdf-geo" }
pdf-geometry = { path = "crates/pdf-geometry" }
pdf-inspect = { path = "crates/pdf-inspect" }
pdf-model = { path = "crates/pdf-model" }
pdf-ocr = { path = "crates/pdf-ocr" }
pdf-pages = { path = "crates/pdf-pages" }
pdf-render = { path = "crates/pdf-render" }
pdf-text = { path = "crates/pdf-text" }
pdf-vector = { path = "crates/pdf-vector" }
pdf-vlm = { path = "crates/pdf-vlm" }
pdfium-render = "0.9"
rayon = "1.12"
regex = "1.13"
rxing = { version = "0.9", default-features = false, features = ["encoding_rs", "decoders", "multi_barcode_readers", "qrcode"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
thiserror = "2.0"
tokio = { version = "1.53", default-features = false, features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", default-features = false, features = ["io", "rt"] }
ureq = { version = "3.4", features = ["json"] }
zune-core = "0.5"
zune-jpeg = "0.5"

[profile.release]
opt-level = 3
lto = "thin"

# The dossier corpus tests decode QR codes over full-page renders; unoptimized
# rxing and image turn a seconds-long pass into minutes.
[profile.dev.package.rxing]
opt-level = 3

[profile.dev.package.image]
opt-level = 3
