[package]
name = "pdf-toolkit"
description = "CLI for inspecting PDFs, cutting pages to PDF or PNG, and extracting plain or structured text."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "pdf-toolkit"
path = "src/main.rs"

[dependencies]
pdf-core.workspace = true
pdf-dossier.workspace = true
pdf-downsample.workspace = true
pdf-geo.workspace = true
pdf-vector.workspace = true
pdf-vlm.workspace = true
llm-providers.workspace = true
pdf-inspect.workspace = true
pdf-model.workspace = true
pdf-ocr.workspace = true
pdf-pages.workspace = true
pdf-render.workspace = true
pdf-text.workspace = true
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
serde.workspace = true
axum.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures-core.workspace = true
hyper.workspace = true
hyper-util.workspace = true
sysinfo.workspace = true
tempfile.workspace = true

[dev-dependencies]
socket2 = { version = "0.6", default-features = false }
image.workspace = true
pdfium-render.workspace = true
webpx = { workspace = true, features = ["decode"] }
